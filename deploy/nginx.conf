# Route ordinary HTTP health checks and WebSocket upgrades through one public path.
map $http_upgrade $pk_relay_path {
    default /ws;
    ''      /health;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    autoindex off;

    types {
        include /etc/nginx/pk_mime_body.types;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Browser upgrades go to /ws; ordinary GET /relay is the relay health check.
    location = /relay {
        proxy_pass http://127.0.0.1:8765$pk_relay_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The AI process is loopback-only. Preserve the client address for its limits.
    location = /ai {
        client_max_body_size 400;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 7s;
        proxy_send_timeout 7s;
    }

    location = /ai/health {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7s;
        proxy_send_timeout 7s;
    }

    # Streamable HTTP MCP endpoint (loopback-only process; wait_for_turn polls up to 25 s).
    location = /mcp {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8767/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /mcp/health {
        proxy_pass http://127.0.0.1:8767/mcp/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 7s;
        proxy_send_timeout 7s;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # The language files keep one file name and change with every wording fix: no one-year immutable cache.
    location /assets/i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 = @plain_404;
    location @plain_404 {
        default_type text/plain;
        return 404 "404 Not Found\n";
    }
}
