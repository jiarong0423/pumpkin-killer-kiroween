<text x="250" y="644" font-size="13" fill="#e8deff">HP 120 · 傷害 30（總和）</text>
<text x="470" y="598" font-size="13.5" fill="#f2ecff">彈跳小盾：骰子決定 1–6 次碰撞，總傷害平均分給每次碰撞。防禦模式</text>
<text x="470" y="618" font-size="13.5" fill="#f2ecff">：放「浮空盾」擋對手攻擊（只有盾衛能防禦）。</text>
