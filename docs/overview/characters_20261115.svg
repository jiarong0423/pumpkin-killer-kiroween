<text x="960" y="326" font-size="13.5" fill="#f2ecff">普攻 的爆炸，並留下 13 團鬼火（約 468 px 寬）。爆炸不流血。</text>
<text x="1480" y="306" font-size="13.5" fill="#c9bde6">特效：砲口閃光、煙霧、落地</text>
<text x="1480" y="326" font-size="13.5" fill="#c9bde6">塵環、星塵、鬼火排（已與頁</text>
<text x="1480" y="346" font-size="13.5" fill="#c9bde6">面原有效果合併）</text>
