<text x="140" y="164" font-size="19" font-weight="700" fill="#fff">骷髏長矛兵</text>
<text x="140" y="186" font-size="12" fill="#b8a9d9">Skeleton Spearman</text>
<text x="140" y="208" font-size="12" fill="#b8a9d9">id: skeleton</text>
