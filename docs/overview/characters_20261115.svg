<text x="282" y="162" font-size="13" fill="#2ecc71" font-weight="700">可玩 · 大招已接進頁面</text>
<text x="250" y="188" font-size="13" fill="#e8deff">HP 100 · 傷害 24</text>
<text x="470" y="160" font-size="13.5" fill="#f2ecff">標槍（骨矛）：命中附「霜咒」，被擊中單位接下來 2 次攻擊 −15%；</text>
<text x="470" y="180" font-size="13.5" fill="#f2ecff">矛會造成流血（每回合起 2 點，共 2 回合）。頭部命中 = 爆擊 ×1.25</text>
<text x="470" y="200" font-size="13.5" fill="#f2ecff"> 並暈眩（下回合只剩 7 秒）。</text>
<text x="960" y="160" font-size="13.5" fill="#f2ecff">三連標槍：一次射出 3 支，每支 1.5×普攻÷3；每中一支，下一支 +5%；</text>
<text x="960" y="180" font-size="13.5" fill="#f2ecff">三支全中 → 第三支爆擊。需先命中 3 次點亮三格能量，一場最多 2 次。</text>
<text x="1480" y="160" font-size="13.5" fill="#c9bde6">特效：蓄力光環、臉部冷焰、</text>
<text x="1480" y="180" font-size="13.5" fill="#c9bde6">矛尾軌跡、命中鬼火與爆裂（j</text>
<text x="1480" y="200" font-size="13.5" fill="#c9bde6">s/ultimate_fx.js）</text>
