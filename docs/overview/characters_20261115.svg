<text x="960" y="618" font-size="13.5" fill="#f2ecff">來的三次攻擊；可來回折返、也能保護隊友；多人對戰最有用。一個點只</text>
<text x="960" y="638" font-size="13.5" fill="#f2ecff">擋一次、只擋多發投擲的第一發、完全擋住。</text>
