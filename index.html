      if (defendMode) cancelDefendMode();
      moveMode = true;
      floatTexts.push({ x: CANVAS_W / 2, y: 220, text: T("toast.moveHelp"), color: "#ffd32a", alpha: 1.0 });
    }
    function cancelMoveMode() { if (moveMode) { moveMode = false; floatTexts.push({ x: CANVAS_W / 2, y: 220, text: T("toast.moveCancel"), color: "#a29bfe", alpha: 1.0 }); } }
    function chooseMoveDir(dir) { // dir: +1 forward (toward the enemy), -1 backward
      if (!moveMode || turn !== "player") return;
      moveMode = false;
      turn = "busy";
      floatTexts.push({ x: player.x, y: player.y - 215, text: T("toast.moveRoll", { dir: T(dir > 0 ? "move.forward" : "move.back") }), color: "#ffd32a", alpha: 1.0 });
      startDiceRoll("player", dir);
    }

    const DICE_TUMBLE_SEC = 0.5;   // owner 2026-11-18: "the dice roll, make it shorter" (was 0.8 s); the rattle sound is cut to the same length (duration 0.5)
    function stepDice(dt) {
      if (!diceRoll) return;
      const d = diceRoll;
      d.t += dt;
      if (d.t < DICE_TUMBLE_SEC) { d.shown = 1 + Math.floor(Math.random() * 6); return; }  // tumbling
      d.shown = d.final;
      if (!d.applied) {
        d.applied = true;
        snd("dice_result"); snd("move_step");
        const o = { dir: d.dir, steps: d.final };
        const u = d.owner === "player" ? player : ai;
        // "forward" means toward the enemy: +x for the player, -x for the AI
        const towardEnemy = d.owner === "player" ? 1 : -1;
        const [lo, hi] = MOVE_ZONE[d.owner === "player" ? "player" : "ai"];   // movement zones: the forward limits are 640 / 1280 since 2026-11-18 (they were 680 / 1240; the fence collision grew to the drawn gate, 841..1079, and with the old limits some pairs at wind +-4..5 could no longer be hit: scripts/test_wind_reach.js), the retreat limits go back to the edge (110 / 1810: the 220 px figure then just touches the world edge) (owner 2026-11-17: "the characters can move over a bigger range"); the most distant pair is now 1700 px (110 to 1810); against a headwind of -4 the longest shot LANDS at absolute x 1595-1642 when the shooter stands at x 110 (scripts/reach_in_headwind.py: no role can touch a target in the corner x 1810 from wind -4 on; at -3 only 0 to 3 of the 8 target roles for most roles, all 8 for the bride and the hunchback), so the far corner can be out of reach in strong headwind (owner decision H15 in docs/GAP_QUEUE_OPEN_20261119.md); start positions remain unchanged
        const moveDist = (typeof Weather !== "undefined") ? Weather.applyMove(currentWeather(), o.steps * DICE_STEP_PX) : o.steps * DICE_STEP_PX;   // snow halves the dice move
        let nx = Math.max(lo, Math.min(hi, u.targetX + towardEnemy * o.dir * moveDist));
        if (TEAM_N > 1) {   // a unit never stops within 120 px of a living teammate (units must not overlap or swap places): step back toward where it stood until the spot is free
          const mates = unitsOf(d.owner === "player" ? "left" : "right").filter(m => m !== u && m.hp > 0);
          const from = u.targetX, to = nx;
          nx = from;   // fallback: stay
          for (let k = 20; k >= 0; k--) { const cx = from + (to - from) * k / 20; if (!mates.some(m => Math.abs(cx - m.targetX) < 120)) { nx = cx; break; } }
        }
        const moved = Math.round(Math.abs(nx - u.targetX));
        u.targetX = nx;
        const localSide = d.owner === "player" ? "left" : "right";
        if (relayClient && relayRoomCode && seats[localSide] === "human" && !d.remote) {
          broadcastLocalAction({ unit: u.id, kind: "move", die: d.final, dirX: towardEnemy * o.dir, result: { x: nx, y: u.y } });
        }
        floatTexts.push({ x: u.x, y: u.y - 215, text: T("toast.moveResult", { roll: d.final, dir: T(o.dir > 0 ? "move.forward" : "move.back"), moved: moved, edge: moved < moveDist ? T("move.atEdge") : "" }), color: "#ffd32a", alpha: 1.0 });
      }
      d.afterT += dt;
      if (d.afterT > 1.1) {
        const owner = d.owner, then = d.then;
        diceRoll = null;
        if (owner === "player" && d.remote) { /* a teammate's move: this page keeps waiting for the teammate's throw or end_turn */ }
        else if (owner === "player") { movedThisTurn = true; if (!gameOver) turn = "player"; }
        else if (then) then();
        else if (TEAM_N > 1) routeAfterTurn("ai", 0);
        else resolveRound();
      }
    }

    function randomizePositions(showNotice=false) {
      // Determinism produces world positions. Convert once at this boundary, then
      // keep every gameplay calculation in the local "me on the left" frame.
      const newPlayerX = Determinism.startX(matchSeed, 0, 0);
      const newAiX = Determinism.startX(matchSeed, 1, 0);
      const worldStartX = side => side === "left" ? newPlayerX : newAiX;
      player.targetX = Math.round(localPerspective.x(worldStartX(localPerspective.worldSide("left"))));
      ai.targetX = Math.round(localPerspective.x(worldStartX(localPerspective.worldSide("right"))));
      if (TEAM_N > 1 && typeof TeamBattle !== "undefined") {   // N > 1: spaced slots for every unit of a team (R3.1)
        ["left", "right"].forEach(side => {
          const worldSlots = TeamBattle.slots(matchSeed, localPerspective.worldSide(side) === "left" ? 0 : 1, TEAM_N, Determinism.startX);
          unitsOf(side).forEach((u, i) => { u.targetX = Math.round(localPerspective.x(worldSlots[i].x)); if (!matchStarted) u.x = u.targetX; });
        });
      }

      if (showNotice) {
        floatTexts.push({ x: CANVAS_W / 2, y: 160, text: T("toast.gapShift", { px: Math.round(Math.abs(ai.targetX - player.targetX)) }), color: "#ffd32a", alpha: 1.0 });
      }
    }

    // Each class has its own HP: apply to both sides (called at match start and on reset).
    function applyClassStats() {
      const pp = HERO_PROFILES[currentHero], ap = HERO_PROFILES[aiClass];
      unitsOf("left").forEach((u, i) => { const hp0 = HERO_PROFILES[leftHeroes[i]] || pp; if (hp0) { u.maxHp = unitStartHp(hp0); u.hp = u.maxHp; } });   // every unit starts with its hero's hp; in team matches (2 or 3 units) the scaled hp of js/team_tuning.js
      unitsOf("right").forEach((u, i) => { const hp1 = HERO_PROFILES[rightHeroes[i]] || ap; if (hp1) { u.maxHp = unitStartHp(hp1); u.hp = u.maxHp; } });
    }
    function switchHero(heroKey, quiet) {
      currentHero = heroKey;
      if (quiet !== undefined || true) { const pp0 = HERO_PROFILES[heroKey]; if (pp0 && typeof player !== "undefined") unitsOf("left").forEach((u, i) => { const hp0 = HERO_PROFILES[leftHeroes[i]] || pp0; u.maxHp = unitStartHp(hp0); u.hp = u.maxHp; }); }
      document.querySelectorAll(".hero-tab").forEach(t => t.classList.toggle("active", t.dataset.hero === heroKey));
      if (!quiet) floatTexts.push({ x: player.x, y: player.y - 180, text: T("toast.switchHero", { name: HERO_PROFILES[heroKey].name }), color: "#ffd32a", alpha: 1.0 });
      updateShieldButton();
    }

    // Only the Pumpkin Guard may choose Defend; every other class can only attack or move.
    // (The guard can give up its attack to place/move the floating shield.)
    const SHIELD_ARC = { halfSpan: 380, over: 245, rise: 85 };   // owner 2026-11-16 ("extend it, a bit lower"): the shield slides within 380 px either side of its unit, 245 px above the feet at the ends and 330 px above at the middle
    const shieldClampX = (x) => Math.max(180, Math.min(1000, Math.max(player.x - SHIELD_ARC.halfSpan, Math.min(player.x + SHIELD_ARC.halfSpan, x))));
    const shieldArcY = (x) => { const d = Math.max(-1, Math.min(1, (x - player.x) / SHIELD_ARC.halfSpan)); return player.y - SHIELD_ARC.over - SHIELD_ARC.rise * (1 - d * d); };
    function updateShieldButton() {

    // =========================================================================
    // Press & hold charge mechanics
    // =========================================================================
    function startCharging() {
      const unit = unitOf(activeSide());
      if (defendMode) { floatTexts.push({ x: unit.x, y: unit.y - 200, text: T("toast.noAttackInDefend"), color: "#ff7675", alpha: 1.0 }); return; }

    }

    function releaseAndThrow() {
      if (!isCharging) return;
      const side = activeSide(), unit = unitOf(side), team = teamOf(side), charges = skillChargesOf(side);
      if (gameAudio) gameAudio.stop("charge", 0.05);
      isCharging = false;
      if (performance.now() - chargeStart < 250 || chargePower < 12) {   // a tap, or a release while the meter is near zero, cancels (mouse and touch alike)
        chargePower = 0; unit.animState = "idle"; unit.animProgress = 0;

      }
      turn = "busy";
      unit.animState = "throw";
      unit.animProgress = 0;
      hideFirstHint();
      const power = chargePower;
      chargePower = 0;
      unit.onRelease = () => {
        const firedAngle = angleOfTeam(team === "player" ? "player" : "ai");
        executeThrow(team, power);
        if (selectedSkill === "double" && charges.double > 0) {
          charges.double--; document.getElementById("badge-double").innerText = charges.double;
          setTimeout(() => executeThrow(team, Math.min(MAX_POWER, power * 1.04), firedAngle, unit), 260); selectSkill("normal");
        } else if (selectedSkill === "heavy" && charges.heavy > 0) {
          charges.heavy--; document.getElementById("badge-heavy").innerText = charges.heavy; selectSkill("normal");
        }

    }

    // =========================================================================
    // TRUE FORWARD ATTACK DIRECTION & LAUNCH POINT
    // =========================================================================
    function executeThrow(shooter, power, requestedAngle, thrower) {   // thrower: the unit that fired (a double shot flies 260 ms later, when the turn may already have rotated to the next unit)
      const throwRand = relayLive() ? relayStream(throwSeq + 1) : Math.random;   // in a room the shuriken spread and the shield bounce count come from a stream seeded by the match and the throw number: the same numbers on both devices
      const isPlayer = shooter === "player";
      const u = thrower || (isPlayer ? player : ai);
      const profile = HERO_PROFILES[isPlayer ? currentHero : ai.profile];

      const angleDeg = angleOfTeam(isPlayer ? "player" : "ai");
      const launchAngleDeg = Number.isInteger(requestedAngle) ? requestedAngle : angleDeg;
      recordThrowNumbers(shooter, launchAngleDeg, power);
      const rad = (launchAngleDeg * Math.PI) / 180.0;
      
      // FORWARD DIRECTION:
      // Player 1 (Red on left) throws to the RIGHT (+1) toward enemy!
      // Player 2 (AI on right) throws to the LEFT (-1) toward player!
      const dirX = isPlayer ? 1 : -1;

      // Base initial velocity
      const v0 = power * 13.8;
      const vx = v0 * Math.cos(rad) * dirX;
      const vy = -v0 * Math.sin(rad);

      // Launch from the FRONT HAND of the character (towards the center wall):
      // Player 1 launches from right side of body: u.x + 75
      // Player 2 launches from left side of body: u.x - 75
      const isWizard = profile.weapon === "cannonball";
      if (isPlayer) player.stunNow = false;
      if (ammo[shooter] > 0) ammo[shooter]--;
      const isShield = profile.weapon === "proj_shield";   // the knight throws from the hand that holds the shield: about 51 px forward, 73 px above the feet
      const fwd = isWizard ? WIZARD_MUZZLE.fwd : (isShield ? 51 : 58);
      const startX = relayForcedStart ? relayForcedStart.x : u.x + dirX * fwd;   // a remote throw starts where its sender says (the sender's own unit may still be gliding on this device)
      const startY = u.y - (isWizard ? WIZARD_MUZZLE.up : (isShield ? 73 : 110));
      const launchY = relayForcedStart ? relayForcedStart.y : startY;   // a remote throw starts where its sender says; the launch point line above is pinned by scripts/test_sim_balance.js
      const localSide = isPlayer ? "left" : "right";
      if (relayClient && relayRoomCode && seats[localSide] === "human" && !remoteApplying) {
        const claimed = relayLive() ? relayFlightLanding(startX, launchY, power, launchAngleDeg, dirX, profile.weapon === "proj_soundwave") : null;   // the cheap cross-check of protocol section 5
        const ultKind = relayLive() && ultArmed[shooter] && energy[shooter] >= 3 && ultUsed[shooter] < 2 && profile.weapon !== "proj_flame";
        relayLanded = {}; broadcastLocalAction(Object.assign({ unit: u.id, kind: ultKind ? "ultimate" : "throw", angle: launchAngleDeg, power, start: { x: startX, y: launchY }, dirX }, claimed ? { claimed_landing: { x: Math.round(claimed.x), y: Math.round(claimed.y) } } : {}));
      }
      const isHeavyShot = selectedSkill === "heavy";
      const usingDouble = selectedSkill === "double";
      // The hand-held weapon really leaves the hand (pumpkin heavy shot is a separate item)
      if (!isHeavyShot && !isWizard) u.armed = false;

      projectiles.push({
        team: shooter,
        flightDir: dirX,
        aiAim: shooter === "ai" ? aiAimPending : aiAimPendingLeft,
        startX: startX,
        weapon: isHeavyShot ? "proj_pumpkin" : profile.weapon,
        wLen: isHeavyShot ? 90 : profile.wLen,
        wThick: isHeavyShot ? 90 : profile.wThick,
        isHeavy: isHeavyShot,
        dmg: (isHeavyShot ? profile.dmg * 1.5 : profile.dmg) * ((isPlayer ? player : ai).weak > 0 ? 0.85 : 1),
        x: startX,
        y: launchY,
        vx: vx,
        vy: vy,
        trail: [],
        recordedPath: [{ x: startX, y: launchY }] // Full trajectory recording
      });
      { const su = isPlayer ? player : ai; if (su.weak > 0) { su.weak--; floatTexts.push({ x: su.x, y: su.y - 235, text: T("status.frostWeak"), color: "#8be9ff", alpha: 1.0 }); } }
      {  // Knight's thrown shield BOUNCES (owner 2026-11-09): a die decides how many collisions it makes; the total damage is split evenly over them.
        const pj = projectiles[projectiles.length - 1];
        pj.throwId = ++throwSeq;
        if (isPlayer && aiKnightRoundsLeft > 0) {   // the right computer knight's Shield Wall: each left throw uses one of its three attack opportunities (same rule as the hand-placed wall below)
          const kpathAi = predictPath(startX, startY, vx, vy, dirX);
          let kj = -1;
          if (profile.weapon !== "proj_axe") aiKnightPts.forEach((g, gi) => {
            if (kpathAi.some(q => Math.abs(q.x - g.x) <= KNIGHT_ZONE && Math.abs(q.y - g.y) <= SHIELD_WALL_COFFIN_HEIGHT / 2) &&
                (kj < 0 || (dirX < 0 ? g.x > aiKnightPts[kj].x : g.x < aiKnightPts[kj].x))) kj = gi;
          });
          aiKnightRoundsLeft--;
          if (kj >= 0) { pj.ultBlock = { x: aiKnightPts[kj].x, y: aiKnightPts[kj].y }; aiKnightPts.splice(kj, 1); }
          if (aiKnightRoundsLeft <= 0 || !aiKnightPts.length) { aiKnightPts = []; aiKnightRoundsLeft = 0; }
        }
        if (!isPlayer && knightRoundsLeft > 0) {   // each enemy throw uses one of the three Shield Wall attack opportunities (the wall belongs to the team, not to the active unit)
          const kpath = predictPath(startX, startY, vx, vy, dirX);
          let ki = -1;
          if (profile.weapon !== "proj_axe") knightPts.forEach((g, gi) => {
            if (kpath.some(q => Math.abs(q.x - g.x) <= KNIGHT_ZONE && Math.abs(q.y - g.y) <= SHIELD_WALL_COFFIN_HEIGHT / 2) &&
                (ki < 0 || (dirX < 0 ? g.x > knightPts[ki].x : g.x < knightPts[ki].x))) ki = gi;
          });
          knightRoundsLeft--;
          if (ki >= 0) { pj.ultBlock = { x: knightPts[ki].x, y: knightPts[ki].y }; knightPts.splice(ki, 1); }
          if (knightRoundsLeft <= 0 || !knightPts.length) { knightPts = []; knightRoundsLeft = 0; }
        }
        const who = isPlayer ? "player" : "ai";
        // Normal attack = ONE shuriken at ONE unit (owner: a normal attack is a single shot). The 5-shuriken SCATTER is the cat-bat's ULTIMATE (needs three lit pips,
        // max 2 per match): each shuriken carries 1.5 x normal / 5, so the whole volley is at most 1.5 x the normal hit on one unit.
        if (pj.weapon === "proj_shuriken" && !pj.isHeavy && energy[who] >= 3 && ultUsed[who] < 2 && (ultArmed[who] || (who === "ai" && aiUltimateCandidate))) {
          energy[who] = 0; ultUsed[who]++; ultArmed[who] = false;
          pj.dmg = Math.round(pj.dmg * 1.5 / 5 * 10) / 10; pj.ultThrow = true; pj.ultBatGroup = { hits: 0 };
          floatTexts.push({ x: startX, y: startY - 100, text: T("ult.shuriken"), color: "#ffd32a", alpha: 1.0 });
          ultCastFx(u, "bat");
          ultFxPlay("proj_shuriken", "launch", startX, startY, dirX, pj.dmg);
          const spread = [-8, -4, 4, 8];
          spread.forEach(deg => {
            const r = (relayLive() && dirX < 0 ? -deg : deg) * Math.PI / 180, sc = 0.95 + throwRand() * 0.1, c = Math.cos(r), sn = Math.sin(r);
            projectiles.push(Object.assign({}, pj, { vx: (pj.vx * c - pj.vy * sn) * sc, vy: (pj.vx * sn + pj.vy * c) * sc, trail: [], recordedPath: [{ x: pj.x, y: pj.y }], extra: true }));
          });
        }
        // GHOST NUN ultimate (owner 2026-11-15/16): the silver cross spins like a dart through up to three enemies, two contacts each at half the normal damage (provisional, js/nun_ult.js), and one of the enemies it touched is electrically stunned
        if (pj.weapon === "proj_cross" && !pj.isHeavy && energy[who] >= 3 && ultUsed[who] < 2 && (ultArmed[who] || (who === "ai" && aiUltimateCandidate))) {
          energy[who] = 0; ultUsed[who]++; ultArmed[who] = false;
          pj.ultThrow = true; pj.ultNun = true;
          floatTexts.push({ x: startX, y: startY - 100, text: T("ult.nun"), color: "#dfe8f2", alpha: 1.0 });
          ultCastFx(u, "hag");
        }
        // HUNCHBACK ultimate (owner 2026-11-16): the boomerang axe pierces every unit on the way out (21 each, shields do not stop it), turns where it lands and returns to the first unit it hit for 31.5
        if (pj.weapon === "proj_axe" && !pj.isHeavy && energy[who] >= 3 && ultUsed[who] < 2 && (ultArmed[who] || (who === "ai" && aiUltimateCandidate))) {

      drawUltRing(ai, "white");
      drawBackFires(ai, "white");
      unitsOf("right").forEach(u => { if (TEAM_N === 1 || u.hp > 0) drawFullArtCharacter(u, HERO_PROFILES[u.profile || ai.profile].imgKey, "white", false); });
      if (SHOW_HITBOXES) drawHitboxOverlay();

      // 7. The press-to-charge power is read from the bar in the dock (colourful, filled by the hold time); the round gauge around the unit is gone (owner 2026-11-17: 'no more round energy bar, show it at the bottom')

      // 8. Flying Projectiles
      drawThrownPaths();
      projectiles.forEach(drawProjectile);

      // 8b. Muzzle flashes
      fxList.forEach(fx => {
        const im = images[fx.img];
        if (!im || !im.complete) return;
        const k = fx.t / fx.dur;
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.scale(fx.dirX, 1);
        ctx.globalAlpha = 1 - k;
        const sz = fx.size * (0.7 + 0.6 * k);
        ctx.drawImage(im, fx.center ? -sz / 2 : -sz * 0.15, -sz / 2, sz, sz);
        ctx.restore();
      });

      // 9. Particles (new system first, the old simple dots on top)
      if (fxSys && typeof drawParticles === "function") drawParticles(ctx, fxSys.particles);
      particles.forEach(pt => {
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 10. Floating Text Popups
      const placedTexts = [];   // popups that would print on top of each other (Stun + Crit! + damage) are stacked upwards instead
      floatTexts.forEach(ft => {
        ctx.save();
        const fontSize = fs(ft.fontSize || 18);
        ctx.font = "bold " + fontSize + "px " + FONT_BODY;
        const textWidth = ctx.measureText(ft.text).width;
        const textX = Math.max(textWidth / 2 + 12, Math.min(CANVAS_W - textWidth / 2 - 12, ft.x));
        let textY = ft.y;
        for (let guard = 0; guard < 8; guard++) {
          const hit = placedTexts.find(r => Math.abs(r.x - textX) < (r.w + textWidth) / 2 && Math.abs(r.y - textY) < fontSize * 1.05);
          if (!hit) break;
          textY = hit.y - fontSize * 1.1;
        }
        placedTexts.push({ x: textX, y: textY, w: textWidth });
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.9)";
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, textX, textY);
        ctx.restore();
      });

      // 11. Top HUD
      drawTopHUD();
    }

    function drawHistoryTrajectories() {
      // Flight-path lines are NOT kept on screen after a shot (owner decision). The remembered enemy paths are only
      // shown while the Pumpkin Guard is placing the floating shield (they are the "valid paths" it snaps onto).
      if (!historyTrajectories.length || (!defendMode && !showPathLines)) return;

      ctx.save();
      historyTrajectories.forEach((traj, idx) => {
        if (traj.team === "player") return;   // only the enemy's remembered paths matter for the shield
        const isPlayer = traj.team === "player";
        const strokeColor = isPlayer ? "#ffd32a" : "#ff7675";
        
        // Knight selected: enemy paths become the glowing 有效路徑 the shield can lock onto
        const valid = !isPlayer && canControlShield();
        ctx.strokeStyle = valid ? "#4deeea" : strokeColor;
        ctx.lineWidth = valid ? 6 : 3;
        ctx.setLineDash([8, 6]);
        ctx.globalAlpha = valid ? 0.9 : 0.55;

        ctx.beginPath();
        traj.points.forEach((pt, pIdx) => {
          if (pIdx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        // Draw Landing / Impact Marker Dot
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(traj.landingX, traj.landingY, 6, 0, Math.PI * 2);
        ctx.fill();

        // Tiny Landing Tag
        ctx.font = "bold " + fs(11) + "px " + FONT_BODY;
        ctx.textAlign = "center";
        ctx.fillText(T("hud.trailTag", { round: traj.round }), traj.landingX, traj.landingY - 12);
      });
      ctx.restore();
    }

      ctx.fillStyle = "#ff9f1a"; ctx.strokeStyle = "#3b1d00"; ctx.lineWidth = 1.5;

    // =========================================================================

    const ART_POSE_XFIX = { pose_necro_windup: 172 / 1024, pose_necro_release: -142 / 1024, pose_necro_hit: 30 / 1024, pose_necro_idle2: 0, pose_necro_charge2: -12 / 1024, pose_necro_ult: 130 / 1024,
      pose_bride_release: 34 / 1024, pose_bride_hit: 21 / 1024, pose_wiz_windup: -22 / 1024, pose_wiz_release: -12 / 1024,
      pose_skel_release: -0.09, pose_bat_hit: -0.09, pose_hag_release: 0.06 };   // feet measured against the idle art (boots band), 2026-11-16: keeps the feet planted when the frame changes   // fraction of the unit width; measured with the robe centroid of each frame against the idle art (2026-11-15)
    const ART_FACES_RIGHT = { unit_skeleton: false, unit_wizard: false, unit_bat: false, unit_knight: false, unit_reaper: false, unit_bride: false, unit_hunchback: true, unit_hag: false };   // hunchback: owner 2026-11-16 saw both sides facing away, so every hunchback frame is mirrored

      unit_bride: { windup: "pose_bride_windup", charge2: "pose_bride_charge", release: "pose_bride_release", hit: "pose_bride_hit" },

      unit_knight: { release: "pose_knight_release", hit: "pose_knight_hit" },   // windup keeps the idle cross kite shield (avoids switching to the round buckler art); release/hit use unarmed open-hand frames
      unit_reaper: { windup: "pose_necro_windup", charge2: "pose_necro_charge2", release: "pose_necro_release", hit: "pose_necro_hit", idle2: "pose_necro_idle2", ult: "pose_necro_ult" }   // idle stays the idle art; idle2 alternates with it every 0.9 s; charge2 is the late part of the charge; ult shows for 1 s after the ultimate
    };
    const UNARMED_ART = { unit_skeleton: "unit_skeleton_unarmed", unit_bat: "unit_bat_unarmed", unit_knight: "unit_knight_unarmed", unit_hunchback: "unit_hunchback_unarmed" };   // the knight one is a Colab job; until it exists the painted shield stays
    // Muzzle (cannon) position in screen offset from the feet, forward-positive
    const WIZARD_MUZZLE = { fwd: 70, up: 118 };
    // Collision radius of the drawn projectile beyond what the 70 px box already allows: sqrt(wLen * wThick) / 2 - 20, never negative; the bride's wave is landing-based and has none. The Python engine uses the same formula (scripts/mcp_game_server.py PROJECTILE_SIZE, tested by scripts/test_hit_radius.py).
    const WEAPON_DRAW_SCALE = 1.35;
    const FLAME_HEAD_SHIFT = 0.353;   // fraction of wLen: the bright head of fx_flame_comet.png sits at column 131 of 890 (0.147 from its left edge), i.e. 0.353 of the length from the centre (scripts/check_visual_overlap.py --flame-head-shift)
    function projHitRadius(p) { return p.weapon === "proj_soundwave" ? 0 : Math.max(0, Math.sqrt((p.wLen || 0) * (p.wThick || 0)) / 2 - 20); }
    const WAVE_HALF_WIDTH = SoundWave.HIT_HALF_WIDTH;   // 105 px (js/sound_wave.js)
    const waveFactorOLD = 105;   // the bride's wave reaches 105 px either side of its centre (class_stats_v2.md); damage in three steps (cells of 35 px since 2026-11-18): 100 percent to 35 px, 75 percent to 70 px, 50 percent to 105 px (js/sound_wave.js is the source; it lands)
    const waveDamage = (dx, dmg) => SoundWave.damageAt(dx, dmg);   // stepped falloff from the wave centre in cells of 35 px: 100 percent to 35 px, 75 to 70, 50 to 105
    let fxList = [];
    let screenShake = 0;
    let showPathLines = false; // persistent flight-path lines: HIDDEN by default (T key toggles, for debugging)
    let flipAllArt = false; // global horizontal mirror toggle for all hero art (F key)
    let flashCv = null;
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const lerp = (a, b, t) => a + (b - a) * t;

    // Returns the body pose for the current animation state (local space, art faces left).
    function computePose(u, team) {
      const P = { rot: 0, sx: 0, sy: 0, scx: 1, scy: 1, flash: 0 };
      const WIND = { rot: 16, sx: 18, sy: 4, scx: 0.98, scy: 0.96 };   // coiled back
      const LUNGE = { rot: -26, sx: -42, sy: -8, scx: 1.05, scy: 1.04 }; // whip forward
      const t = u.animProgress;
      if (u.animState === "idle") {
        P.sy = (TEAM_N > 1 && u !== unitOf(sideOfUnit(u))) ? 0 : Math.sin(performance.now() / 700 + u.x) * 0.7;   // a unit that is not on turn stands completely still (R2.4: frozen, "sits out")
        // owner 2026-11-16: the characters must not keep trembling: the idle breathing is now a barely visible slow drift
      } else if (u.animState === "charge") {
        const k = easeOutCubic(Math.min(1, t / 0.25));
        const power = team === "red" ? Math.min(1, chargePower / MAX_POWER) : 0.6;
        const tremble = 0;   // owner 2026-11-16: "do not shake": the charge no longer trembles (it was sin(t*46) * (0.6 + 2.2 * power) * k)
        P.rot = WIND.rot * k + tremble;
        P.sx = WIND.sx * k;
        P.sy = WIND.sy * k;
        P.scx = lerp(1, WIND.scx, k);
        P.scy = lerp(1, WIND.scy, k);
      } else if (u.animState === "throw") {
        const r = ANIM.releaseAt;
        if (t < r) {
          const k = easeInOutCubic(t / r); // fast whip from coiled pose to full lunge
          for (const f of ["rot", "sx", "sy", "scx", "scy"]) P[f] = lerp(WIND[f], LUNGE[f], k);
        } else {
          const q = (t - r) / (1 - r);           // follow-through with slight overshoot, then settle
          const spring = Math.exp(-4.2 * q) * Math.cos(5.5 * q);
          for (const f of ["rot", "sx", "sy"]) P[f] = LUNGE[f] * spring;
          P.scx = 1 + (LUNGE.scx - 1) * spring;
          P.scy = 1 + (LUNGE.scy - 1) * spring;
        }
      } else if (u.animState === "hit") {
        const imp = Math.exp(-4.2 * t); // owner 2026-11-16: being hit must FEEL like a hit, but one clean recoil and settle, no wobble: a sharp knock-back, lean and squash that ease back
        P.rot = 24 * imp;
        P.sx = 62 * imp;
        P.sy = -10 * Math.exp(-9 * t);
        P.scy = 1 - 0.10 * Math.exp(-7 * t);
        P.scx = 1 + 0.07 * Math.exp(-7 * t);
        P.flash = Math.min(1, 1.4 - t / 0.2);
      }
      // Cannon recoil kicks the wizard backwards after the blast
      P.sx += 28 * u.recoil;
      P.rot += 5 * u.recoil;
      return P;
    }

    // Throwing weapons are separate layers held in the hand (like Ragnarok-style layered sprites).
    // Javelin technique: carry forward, pull the arm BACK, sweep it in an ARC over the shoulder,
    // release in front at the aim angle, then follow through downward. All offsets are px in the
    // 220 px art box, native-left art space (forward = -x, up = -y).
    // Owner 2026-11-09: the painted spear in the original art points BACKWARDS (tip away from the enemy). The weapon is now
    // its own layer, held by a drawn arm and always pointing along the aim angle, so the direction is right for both teams.
    const USE_LAYERED_HANDS = true;
    const HELD_WEAPON = {
      unit_skeleton: { img: "proj_spear", len: 205, thick: 32 },
      unit_bat:      { img: "proj_shuriken", len: 40, thick: 40 }
    };
    const HAND_RIG = {
      unit_skeleton: { hand: [0.31, 0.53], shoulder: [0.43, 0.49], skin: "#efe6cf", edge: "#2b2118", bone: true },
      unit_bat:      { hand: [0.34, 0.70], shoulder: [0.46, 0.58], skin: "#23232c", edge: "#ff9f43" },
      unit_knight:   { hand: [0.27, 0.60], shoulder: [0.45, 0.52], skin: "#2c2f3a", edge: "#9aa3b5", bone: true }   // the thrown shield leaves the REAL shield hand (owner 2026-11-09); no drawn overlay arm
    };
    const bez = (p0, p1, p2, k) => [
      (1 - k) * (1 - k) * p0[0] + 2 * (1 - k) * k * p1[0] + k * k * p2[0],
      (1 - k) * (1 - k) * p0[1] + 2 * (1 - k) * k * p1[1] + k * k * p2[1]
    ];
    function drawThrowingHand(u, imgKey) {
      if (!USE_LAYERED_HANDS) { u.handTrail = null; return; }
      const rig = HAND_RIG[imgKey];
      const held = HELD_WEAPON[imgKey];
      if (!rig) return;
      const L = (fx, fy) => [-u.w / 2 + fx * u.w, -u.h + 15 + fy * u.h];
      const rest = L(rig.hand[0], rig.hand[1]);
      const sh = L(rig.shoulder[0], rig.shoulder[1]);
      const aim = angleOfTeam(sideOfUnit(u) === "left" ? "player" : "ai") * Math.PI / 180; // weapon points along the aim angle
      const idleAim = 20 * Math.PI / 180;
      const t = u.animProgress, r = ANIM.releaseAt;
      const swinging = u.animState === "charge" || u.animState === "throw";
      let hx = rest[0], hy = rest[1], ang = idleAim, open = 0, alpha = 1;
      const P_BACK = [rest[0] + 58, rest[1] - 50];     // javelin windup: arm cocked back behind the shoulder, spear pointing forward

    // Aim guide: the first moments of the real flight (same integrator, wind included), dots that shrink and fade, a reticle where

    // phase), semi-transparent; it shows the angle ONLY (no wind, no power, no path, no white dashed line). The parameter is `g`, never `ctx`: a parameter named ctx once shadowed the canvas
    // context and stopped the whole frame loop (black canvas on the phone).

    function aimLaunchOf(u) {   // the point the thrown weapon leaves from, the same numbers as executeThrow

      return { fwd: wiz ? WIZARD_MUZZLE.fwd : (shield ? 51 : 58), up: wiz ? WIZARD_MUZZLE.up : (shield ? 73 : 110) };

        ctx.save(); ctx.font = "bold 18px " + FONT_BODY; ctx.textAlign = "center"; ctx.fillStyle = col; ctx.strokeStyle = "rgba(20,10,40,0.85)"; ctx.lineWidth = 5; ctx.lineJoin = "round";
        const lb = neutral ? T("move.aimNeutral") : (v > 0 ? T("move.releaseFwd") : T("move.releaseBack")); ctx.strokeText(lb, player.x, player.y - 150); ctx.fillText(lb, player.x, player.y - 150);
        ctx.restore();
      }
      if (diceRoll) {
        const u = diceRoll.owner === "player" ? player : ai;
        const wob = diceRoll.t < DICE_TUMBLE_SEC ? Math.sin(diceRoll.t * 40) * 6 : 0;
        const screenDir = (diceRoll.owner === "player" ? 1 : -1) * diceRoll.dir;      // +1 = arrow points right on screen
        const dy = u.y - MOVE_ROW_DY + wob;
        drawDie(u.x, dy, diceRoll.shown, 56);
        const col = diceRoll.dir > 0 ? "#ffd32a" : "#74b9ff";
        ctx.fillStyle = col; ctx.strokeStyle = "#0c0618"; ctx.lineWidth = 3;
        ctx.beginPath();                                                                // lit arrow beside the die
        ctx.moveTo(u.x + screenDir * 74, dy); ctx.lineTo(u.x + screenDir * 44, dy - 18); ctx.lineTo(u.x + screenDir * 44, dy + 18);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        if (diceRoll.t >= DICE_TUMBLE_SEC) {
          ctx.font = "bold 26px " + FONT_BODY; ctx.textAlign = "center";
          ctx.fillText(`${screenDir > 0 ? "▶" : "◀"} ${diceRoll.final}`, u.x, dy - 46);
        }
      }
      ctx.textAlign = "center";
      if (!gameOver && turn === "player") {
        ctx.font = "bold " + fs(18) + "px " + FONT_BODY;
        ctx.fillStyle = "#4deeea";
        { const au = unitOf(activeSide()); ctx.fillText(T("hud.angle", { angle: activeAngle() }), au.x, au.y - 232 - BODY_LIFT); }
        if (canAimNow()) { if (SHOW_AIM_GUIDE) drawAimGuide(); drawAimArrow(); drawSlingPull(); }   // the aim arrow was taken out again (owner 2026-11-18): the slingshot pull band, the angle readout and the power bar are enough   // the full trajectory guide stays off; the plain arrow shows only the aim angle (owner 2026-11-17)
        if (SHOW_ANGLE_PLATES && !defendMode && !moveMode && !isCharging) {
          // angle stepper plates (touch friendly; arrow keys / W S still work)
          anglePlates().forEach(b => {
            ctx.fillStyle = "rgba(12,6,24,0.85)"; ctx.strokeStyle = "#4deeea"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.roundRect(b.x - 46, b.y - 34, 92, 68, 16); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#4deeea"; ctx.font = "bold 34px " + FONT_BODY; ctx.fillText(b.label, b.x, b.y + 12);
          });
        }
      }
      if (gameOver) {
        ctx.fillStyle = "rgba(10,5,20,0.38)";   // lighter veil: the result is a small frosted panel, the scene stays visible
        ctx.fillRect(-PAD, 0, VIEW_W, CANVAS_H);
        const bw = RESULT_PANEL.w, bh = RESULT_PANEL.h, bx = CANVAS_W / 2 - bw / 2, by = CANVAS_H / 2 - 135 - 40;   // by must match RESULT_BUTTONS
        ctx.fillStyle = "rgba(24,14,46,0.55)"; ctx.strokeStyle = "rgba(165,243,255,0.4)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 22); ctx.fill(); ctx.stroke();
        ctx.font = "bold 44px " + FONT_DISPLAY; ctx.textAlign = "center";
        ctx.fillStyle = gameOver === "player" ? "#ffd32a" : "#ff9f9f";
        ctx.fillText(T(resultTextKey()), CANVAS_W / 2, by + 84);
        if (dailyCode) { ctx.font = "bold 26px " + FONT_BODY; ctx.fillStyle = "#a5f3ff"; ctx.fillText(T("daily.code", { code: dailyCode }), CANVAS_W / 2, by + 132); }   // the daily match shows its date code under the result
        const btns = RESULT_BUTTONS();
        btns.forEach(bt => {
          ctx.fillStyle = bt.again ? "rgba(255,138,31,0.92)" : "rgba(40,22,74,0.9)"; ctx.strokeStyle = bt.again ? "#ffd32a" : "rgba(165,243,255,0.7)"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.roundRect(bt.x, bt.y, bt.w, bt.h, 16); ctx.fill(); ctx.stroke();
          ctx.font = "bold 26px " + FONT_BODY; ctx.fillStyle = bt.again ? "#3b1d00" : "#fff"; ctx.textAlign = "center"; ctx.fillText(T(bt.key), bt.x + bt.w / 2, bt.y + bt.h / 2 + 9);
        });
      }
      ctx.restore();
    }

    function resultTextKey() {   // gameOver is "player", "ai" or, after a lost AI team (ROOM-FLOW R9), "none"
      if (gameOver === "none") return "gameover.noContest";
      if (seats.left === "human" && seats.right === "human" && !relayRoomCode) return gameOver === "player" ? "gameover.leftWin" : "gameover.rightWin";   // a room: every phone shows its own team on the left, so it says you won / you lost (DESIGN-1)
      return gameOver === "player" ? "gameover.win" : "gameover.lose";
    }

    const PHYSICS_STEP = 1 / 60;
    let stepAccumulator = 0;

    // Main Game Loop
    function loop(time) {
      if (Math.random !== NATIVE_RANDOM) Math.random = NATIVE_RANDOM;
      const frameDt = Math.min(0.1, (time - lastTime) / 1000.0);
      lastTime = time;

      // Fixed 1/60 s physics step: the same flight path at any frame rate, so the AI's
      // wind-aware estimate (simulateLandingX) matches what the game actually does.
      stepAccumulator += frameDt;
      let steps = 0;
      while (stepAccumulator >= PHYSICS_STEP && steps < 6) {
        updatePhysics(PHYSICS_STEP);
        stepAccumulator -= PHYSICS_STEP;
        steps++;
      }
      if (steps === 6) stepAccumulator = 0; // drop backlog after a long stall
      paintFrame(frameDt);
      requestAnimationFrame(loop);
    }
    // One picture of the game: the main loop calls it every frame; a room seat that switches the animation frame off for speed (scripts/hybrid_seat_core.js) calls it on a timer so a phone or desktop screen shows the match (owner 2026-11-17: the phone showed a stale frame).
    function paintFrame(frameDt) {
      ctx.save();
      ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);   // world units to backing-store pixels (1 on a mouse screen), then the side pad
      ctx.translate(PAD, 0);
      if (screenShake > 0) ctx.translate((Math.random() - 0.5) * 14 * (screenShake / 0.18), (Math.random() - 0.5) * 8 * (screenShake / 0.18));
      draw();
      if (ultDim > 0) {   // the brief vignette dim after an ultimate cast: edges darken, the middle stays clear
        const vg = ctx.createRadialGradient(CANVAS_W / 2, CANVAS_H / 2, CANVAS_H * 0.35, CANVAS_W / 2, CANVAS_H / 2, CANVAS_H * 0.95);
        vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0," + (ultDim * 0.9).toFixed(3) + ")");
        ctx.fillStyle = vg; ctx.fillRect(-PAD, 0, VIEW_W, CANVAS_H); ultDim = Math.max(0, ultDim - frameDt * 1.2);
      }
      drawRuleOverlay();
      ctx.restore();
    }
    (window.__i18nReady || I18N.loadDictionaries()).catch(() => {}).then(() => { I18N.init("en"); I18N.apply(document); updateShieldButton(); initStartScreen(); applySettings(); showStartScreen(); requestAnimationFrame(loop); });

  </script>
<script>
  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch((error) => {
      console.warn("Service worker registration failed:", error);
    });
  }
</script>
